<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Webinar Folks, How Are You Doing?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #1f2937;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      max-width: 640px;
      width: 100%;
      padding: 56px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.3;
      color: #0f2027;
    }
    .divider {
      width: 64px;
      height: 3px;
      background: #2c5364;
      margin: 24px auto;
      border-radius: 2px;
    }
    p { color: #6b7280; font-size: 1rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello Webinar Folks, How Are You Doing?</h1>
    <div class="divider"></div>
    <p>Welcome, and thank you for joining us today.</p>
  </main>
</body>
</html>
